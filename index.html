  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  toast('Downloaded — open the file to view or share', 3000);
};

window.manualWinner = async function(gid, side) {
  const week = getWeek(currentWeekId);
  if (!week) return;
  const g = week.games ? Object.values(week.games).find(g => g.id === gid) : null;
  if (!g) return;
  const winner = side === 'away' ? g.away : g.home;
  // Allow changing winner even after settling — re-score entries
  const updates = {};
  updates[`/weeks/${currentWeekId}/games/${gid}/winner`] = winner;
  await update(ref(db, '/'), updates);
  // If week was settled, re-score all entries with updated winners
  if (week.settled) {
    const games = week.games ? Object.values(week.games) : [];
    // Merge updated winner into local game list for scoring
    const updatedGames = games.map(g2 => g2.id === gid ? { ...g2, winner } : g2);
    if (updatedGames.every(g2 => g2.winner)) {
      const entries = week.entries ? Object.entries(week.entries) : [];
      const rescoreUpdates = {};
      const poolWinners = [];
      for (const [entryKey, e] of entries) {
        let correct = 0;
        updatedGames.forEach(g2 => { if (e.picks && e.picks[g2.id] === g2.winner) correct++; });
        if (correct === updatedGames.length) poolWinners.push(e.name);
        rescoreUpdates[`/weeks/${currentWeekId}/entries/${entryKey}/correct`] = correct;
        const userData = getUser(e.userId);
        if (userData) {
          // Recalculate total correct across all weeks
          const allWeeks = getWeeks();
          let totalCorrect = 0;
          Object.entries(allWeeks).forEach(([wid, w]) => {
            if (!w.settled || !w.entries) return;
            const wGames = w.games ? Object.values(w.games) : [];
            const wEntry = Object.values(w.entries).find(en => en.userId === e.userId);
            if (!wEntry) return;
            const wGamesUpdated = wid === currentWeekId ? updatedGames : wGames;
            wGamesUpdated.forEach(g2 => { if (wEntry.picks && wEntry.picks[g2.id] === g2.winner) totalCorrect++; });
          });
          rescoreUpdates[`/users/${e.userId}/totalCorrect`] = totalCorrect;
        }
      }
      rescoreUpdates[`/weeks/${currentWeekId}/winners`] = poolWinners.length ? poolWinners : null;
      await update(ref(db, '/'), rescoreUpdates);
      toast(`✓ ${winner} set — scores updated. ${poolWinners.length ? 'Winner: '+poolWinners.join(', ') : 'No winner.'}`, 3500);
    } else {
      toast(`✓ ${winner} set as winner.`);
    }
  } else {
    toast(`✓ ${winner} set as winner.`);
  }
};

window.saveAndSettlePlayoff = async function() {
  const week = getWeek(currentWeekId);
  if (!week || week.settled) return;
  const games = week.games ? Object.values(week.games) : [];
  if (!games.every(g => g.winner)) { toast('Set a winner for every game first.'); return; }
  // Save final scores for O/U scoring
  const updates = {};
  games.forEach(g => {
    const awayEl = document.getElementById(`fs-away-${g.id}`);
    const homeEl = document.getElementById(`fs-home-${g.id}`);
    if (awayEl) updates[`/weeks/${currentWeekId}/games/${g.id}/awayFinalScore`] = parseInt(awayEl.value)||0;
    if (homeEl) updates[`/weeks/${currentWeekId}/games/${g.id}/homeFinalScore`] = parseInt(homeEl.value)||0;
  });
  if (Object.keys(updates).length) await update(ref(db, '/'), updates);
  await doSettleWeek(currentWeekId);
};

window.settleWeek = async function() {
  const week = getWeek(currentWeekId);
  if (!week || week.settled) return;
  if (!confirm('Force settle this week now?')) return;
  await doSettleWeek(currentWeekId);
};

window.payoutPlayoff = async function() {
  const playoffPaid = liveData.playoffSeason?.paidOut;
  if (playoffPaid) { toast('Playoff pool already paid out.'); return; }
  const standings = playoffStandings();
  if (!standings.length || standings[0].pts === 0) { toast('No playoff points recorded yet.'); return; }
  // Find the Super Bowl week for tiebreaker
  const sbWeek = Object.values(getWeeks()).find(w => isSuperBowl(w) && w.settled);
  const topPts = standings[0].pts;
  let leaders = standings.filter(p => p.pts === topPts);
  // Tiebreaker: closest SB combined score without going over
  if (leaders.length > 1 && sbWeek) {
    const sbGames = sbWeek.games ? Object.values(sbWeek.games) : [];
    const sbGame = sbGames[0];
    if (sbGame && sbGame.awayFinalScore !== undefined) {
      const actual = parseInt(sbGame.awayFinalScore||0) + parseInt(sbGame.homeFinalScore||0);
      // Keep only those who guessed without going over, closest wins
      const withGuess = leaders.map(p => {
        const e = sbWeek.entries ? Object.values(sbWeek.entries).find(e => e.userId === p.userId) : null;
        const guess = e?.tbGuess ? parseInt(e.tbGuess) : null;
        return { ...p, guess };
      }).filter(p => p.guess !== null && p.guess <= actual);
      if (withGuess.length) {
        const closest = Math.max(...withGuess.map(p => p.guess));
        leaders = withGuess.filter(p => p.guess === closest);
      }
      // If all went over, keep all tied at top
    }
  }
  const playoffPot = Object.values(getWeeks()).filter(w => isPlayoff(w)).reduce((s,w) => {
    const entries = w.entries ? Object.values(w.entries) : [];
    return s + entries.length * PLAYOFF_ENTRY;
  }, 0) / Object.values(getWeeks()).filter(w => isPlayoff(w)).length || 0;
  // Actually: pot = entries for the playoff pool (all paid $20 once)
  // Count unique entrants across all playoff weeks
  const playoffEntrants = new Set();
  Object.values(getWeeks()).filter(w => isPlayoff(w)).forEach(w => {
    if (w.entries) Object.values(w.entries).forEach(e => playoffEntrants.add(e.userId));
  });
  const pot = playoffEntrants.size * PLAYOFF_ENTRY;
  const split = Math.floor(pot / leaders.length);
  const names = leaders.map(p => p.name).join(', ');
  if (!confirm(`Pay out $${pot} playoff pool to ${names}${leaders.length>1?' ($'+split+' each)':''}?`)) return;
  await dbSet('/playoffSeason', {
    paidOut: true, winners: leaders.map(p=>p.name),
    amount: pot, topPts, paidAt: Date.now()
  });
  toast(`🏆 Playoff pool paid to ${names}!`, 4000);
};

    </div>`;

    <th class="rank">#</th><th>Name</th><th style="text-align:right">Correct</th><th style="text-align:right">Entries</th>

    const splitAmt = leaders.length ? Math.floor(fund / leaders.length) : 0;

    html += `<div style="margin-top:20px;">
      <div class="section-head" style="margin-bottom:10px;">Past seasons</div>`;
    archiveList.forEach(arc => {

        <div>
          <div class="history-week">${yr}</div>
          <div class="history-meta">${arc.weekCount} weeks · $${arc.totalPaidOut} paid out</div>
          ${arc.season?.paidOut ? `<div style="font-size:12px;color:var(--green-text);margin-top:2px;">Most Wins Pot: ${arc.season.winners?.join(', ')} won $${arc.season.amount}</div>` : ''}

    </div>
  </div>`;

  c.innerHTML = html;
}

window.payoutSeason = async function() {

  const standings = seasonStandings();
  if (!standings.length) { toast('No players to pay out.'); return; }

  if (top === 0) { toast('No picks recorded yet.'); return; }

    paidOut: true,
    winners: leaders.map(p => p.name),
    amount: fund,
    topCorrect: top,
    paidAt: Date.now()
  });

};

window.toggleArchive = function(seasonNum) {
  const el = document.getElementById('arc-detail-' + seasonNum);

};

window.archiveAndReset = async function() {
  const weeks = getWeeks();
  const weekCount = Object.values(weeks).length;
  if (weekCount === 0) { toast('No weeks to archive.'); return; }

  const season = liveData.season || {};
  const archives = liveData.archives || {};
  const seasonNum = Object.keys(archives).length + 1;

  // Calculate total paid out across all winning weeks
  const totalPaidOut = Object.values(weeks).reduce((sum, w) => {
    if (w.winners?.length) return sum + totalPot(w);
    return sum;
  }, 0);

  const yr = new Date().getFullYear();
  const label = `${yr} Season`;

  if (!confirm(`Archive "${label}" and reset to Week 1?\n\n${weekCount} weeks will be saved permanently.\nAll player accounts and passwords are kept.`)) return;

  const updates = {};

  // Write archive snapshot
  updates[`/archives/season_${seasonNum}`] = {
    seasonNum,
    label,
    archivedAt: Date.now(),
    weekCount,
    totalPaidOut,
    season: season.paidOut ? season : null,
    weeks: weeks,
    standings: seasonStandings(),
  };

  // Reset user stats
  const users = getUsers();
  Object.entries(users).forEach(([id, u]) => {
    if (!u.isAdmin) {
      updates[`/users/${id}/totalCorrect`] = 0;
      updates[`/users/${id}/totalEntries`] = 0;
    }
  });

  // Wipe active data
  updates['/weeks'] = null;
  updates['/season'] = null;

  await update(ref(db, '/'), updates);

  currentWeekId = null;
  myPicks = {};
  adminTab = 'week';

  toast(`"${label}" archived ✓ — pool reset to Week 1`, 4000);
};

window.resetPool = async function() {
  if (!confirm('Reset the pool to Week 1?\n\nThis will permanently delete all weeks, entries, scores, and the Most Wins Pot.\nPlayer accounts and passwords will be kept.\n\nThis cannot be undone.')) return;
  if (!confirm('Are you sure? All pick history will be lost.')) return;

  // Reset user stats
  const users = getUsers();
  const updates = {};
  Object.entries(users).forEach(([id, u]) => {
    if (!u.isAdmin) {
      updates[`/users/${id}/totalCorrect`] = 0;
      updates[`/users/${id}/totalEntries`] = 0;
    }
  });

  // Wipe weeks and season
  updates['/weeks'] = null;
  updates['/season'] = null;

  await update(ref(db, '/'), updates);

  // Reset local state
  currentWeekId = null;
  myPicks = {};
  adminTab = 'week';

  toast('Pool reset to Week 1 ✓', 3000);
};

window.adminResetPw = async function(userId, name) {

window.toggleHistDetail = function(id) {
